
{% extends "base.html" %}

{% block title %}Edit Listing | RENTLOCAL{% endblock %}

{% block content %}

<section class="page-section">
    <div class="container">

        <h1 class="page-title">Edit Listing</h1>

        <p class="text-secondary">
            Update the details of your equipment listing.
        </p>

        <form
            method="POST"
            class="form-card"
        >

            <!-- Equipment Name -->
            <div class="form-group">
                <label for="title">Equipment Name</label>

                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ listing['title'] }}"
                    required
                >
            </div>


            <!-- Description -->
            <div class="form-group">
                <label for="description">Description</label>

                <textarea
                    id="description"
                    name="description"
                    rows="5"
                    required
                >{{ listing['description'] }}</textarea>
            </div>


            <!-- Category -->
            <div class="form-group">
                <label for="category">Category</label>

                <select
                    id="category"
                    name="category"
                    required
                >
                    <option value="" disabled>
                        Select a category
                    </option>

                    {% for category in categories %}

                        <option
                            value="{{ category }}"
                            {% if listing['category'] == category %}selected{% endif %}
                        >
                            {{ category }}
                        </option>

                    {% endfor %}

                </select>
            </div>


            <!-- Price -->
            <div class="form-group">
                <label for="price_per_day">Price per Day</label>

                <input
                    type="number"
                    id="price_per_day"
                    name="price_per_day"
                    min="0.01"
                    step="0.01"
                    value="{{ listing['price_per_day'] }}"
                    required
                >
            </div>


            <!-- Location -->
            <div class="form-group">
                <label for="location">Location</label>

                <input
                    type="text"
                    id="location"
                    name="location"
                    value="{{ listing['location'] }}"
                    required
                >
            </div>


            <!-- Condition -->
            <div class="form-group">
                <label for="condition">Condition</label>

                <select
                    id="condition"
                    name="condition"
                    required
                >
                    <option value="" disabled>
                        Select condition
                    </option>

                    <option
                        value="Excellent"
                        {% if listing["condition"] == "Excellent" %}selected{% endif %}
                    >
                        Excellent
                    </option>

                    <option
                        value="Good"
                        {% if listing["condition"] == "Good" %}selected{% endif %}
                    >
                        Good
                    </option>

                    <option
                        value="Fair"
                        {% if listing["condition"] == "Fair" %}selected{% endif %}
                    >
                        Fair
                    </option>

                </select>
            </div>


            <!-- Actions -->
            <div>

                <button
                    type="submit"
                    class="button button-primary"
                >
                    Save Changes
                </button>

                <a
                    href="{{ url_for('owner_listings') }}"
                    class="button"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>
</section>

{% endblock %}
